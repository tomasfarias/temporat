[package]
name = "temporat"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A Temporal workflow TUI"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
tempfile = "3"
