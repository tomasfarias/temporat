# Each profile requires an address and namespace. Other settings are optional.
default_profile = "development"

[theme]
name = "solarized-dark" # Also: solarized-light, nord, terminal (terminal palette).

[profiles.development]
address = "localhost:7233"
namespace = "default"
tls = false # TLS defaults to true; disable it for plaintext local servers.

# [profiles.production]
# address = "us-east-1.aws.api.temporal.io:7233"
# namespace = "production.abc123"
# api_key = "..." # Preferred over client certificates. Requires TLS.
# Certificate files are PEM, relative to this TOML file.
# tls_ca = "ca.pem"
# tls_cert = "client.pem"
# tls_key = "client.key"
# tls_domain = "temporal.example.com"

[table]
columns = ["workflow_id", "workflow_type", "status", "start_time", "close_time"]
# Also available: run_id, task_queue, history_length.
# By default, request one screen of rows per page. Optional fixed override:
# page_size = 100
# default_query = "Running"

# Named Temporal visibility queries. No default_query means all workflows.
[queries]
All = ""
Running = "ExecutionStatus = 'Running'"
Failed = "ExecutionStatus = 'Failed'"

# Single-character bindings; Ctrl+c always quits.
[keybindings]
profiles = "n"
up = "k"
down = "j"
left = "h"
right = "l"
refresh = "r"
quit = "q"
query = "/"
load_query = "o"
save_query = "s"
