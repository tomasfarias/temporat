# All settings are optional. TOML values override environment variables.
[connection]
# Uncomment to override these defaults or environment settings.
# address = "http://localhost:7233" # TEMPORAL_ADDRESS
# namespace = "default" # TEMPORAL_NAMESPACE
# api_key = "..." # TEMPORAL_API_KEY; preferred over client certificates
# Bare endpoints (e.g. namespace.account.tmprl.cloud:7233) default to HTTPS.
# Use explicit http:// for plaintext local servers; API keys require HTTPS.
# Certificate files are PEM, relative to this file (environment paths use cwd).
# tls_ca = "ca.pem" # TEMPORAL_TLS_CA
# tls_cert = "client.pem" # TEMPORAL_TLS_CERT
# tls_key = "client.key" # TEMPORAL_TLS_KEY
# tls_domain = "temporal.example.com" # TEMPORAL_TLS_DOMAIN

[table]
columns = ["workflow_id", "workflow_type", "status", "start_time", "close_time"]
# Also available: run_id, task_queue, history_length.
# By default, request one screen of rows per page. Optional fixed override:
# page_size = 100
# default_query = "Running"

# Named Temporal visibility queries. No default_query means all workflows.
[queries]
All = ""
Running = "ExecutionStatus = 'Running'"
Failed = "ExecutionStatus = 'Failed'"

# Single-character bindings; Ctrl+c always quits.
[keybindings]
up = "k"
down = "j"
left = "h"
right = "l"
refresh = "r"
quit = "q"
query = "/"
load_query = "o"
save_query = "s"
